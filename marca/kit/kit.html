<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link href="fonts/fonts.css" rel="stylesheet">
<style>
:root{--g:#7B1E3A;--r:#D2323C;--h:#F5EFE6;--c:#222;--rosa:#E8A5B5}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter;background:#999;display:flex;flex-direction:column;gap:40px;padding:40px;align-items:flex-start}
.p{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
.dark{background:var(--g);color:var(--h)}
.light{background:var(--h);color:var(--g)}
.word{font:800 1em/1 Montserrat;letter-spacing:.06em}
.sub{font:600 1em Montserrat;letter-spacing:.3em;text-transform:uppercase;color:var(--rosa)}
.deco{position:absolute;inset:0;pointer-events:none}
</style></head><body>

<!-- 1. Foto de perfil con nombre (1080×1080; se recorta en círculo) -->
<div id="perfil" class="p dark" style="width:1080px;height:1080px">
 <svg width="560" height="154" viewBox="0 0 620 170" fill="none"><path d="M40 40 Q310 250 580 40" stroke="#E8A5B5" stroke-width="14" stroke-linecap="round"/><circle cx="40" cy="40" r="22" fill="#F5EFE6"/><circle cx="580" cy="40" r="22" fill="#F5EFE6"/><path d="M150 70 Q310 170 470 70" stroke="#D2323C" stroke-width="6" stroke-linecap="round" opacity=".9"/></svg>
 <div class="word" style="font-size:150px;margin-top:20px">HAMACA</div>
 <div class="sub" style="font-size:30px;margin-top:18px">Fisioterapia</div>
</div>

<!-- 2. Símbolo solo (para tamaños muy pequeños) -->
<div id="simbolo" class="p dark" style="width:1080px;height:1080px">
 <svg width="780" height="214" viewBox="0 0 620 170" fill="none"><path d="M40 40 Q310 250 580 40" stroke="#E8A5B5" stroke-width="16" stroke-linecap="round"/><circle cx="40" cy="40" r="24" fill="#F5EFE6"/><circle cx="580" cy="40" r="24" fill="#F5EFE6"/><path d="M150 70 Q310 170 470 70" stroke="#D2323C" stroke-width="8" stroke-linecap="round" opacity=".9"/></svg>
</div>

<!-- 3. Banner de YouTube (2560×1440; zona segura central 1546×423) -->
<div id="youtube" class="p dark" style="width:2560px;height:1440px">
 <svg class="deco" viewBox="0 0 2560 1440" fill="none"><path d="M-100 300 Q1280 2000 2660 300" stroke="#E8A5B5" stroke-width="4" opacity=".25"/><path d="M-100 240 Q1280 2200 2660 240" stroke="#E8A5B5" stroke-width="3" opacity=".15"/><path d="M-100 360 Q1280 1800 2660 360" stroke="#D2323C" stroke-width="3" opacity=".3"/></svg>
 <div style="display:flex;align-items:center;gap:60px;position:relative">
  <svg width="300" height="82" viewBox="0 0 620 170" fill="none"><path d="M40 40 Q310 250 580 40" stroke="#E8A5B5" stroke-width="16" stroke-linecap="round"/><circle cx="40" cy="40" r="24" fill="#F5EFE6"/><circle cx="580" cy="40" r="24" fill="#F5EFE6"/><path d="M150 70 Q310 170 470 70" stroke="#D2323C" stroke-width="8" stroke-linecap="round" opacity=".9"/></svg>
  <div>
   <div class="word" style="font-size:150px">HAMACA</div>
   <div class="sub" style="font-size:34px;margin-top:14px">Fisioterapia de la mujer</div>
  </div>
 </div>
 <div style="position:relative;margin-top:44px;font:600 40px Montserrat;color:var(--h)">Nuevo video cada semana · con Angélica García</div>
</div>

<!-- 4. Portada de la página de Facebook (1640×624) -->
<div id="facebook" class="p dark" style="width:1640px;height:624px">
 <svg class="deco" viewBox="0 0 1640 624" fill="none"><path d="M-60 380 Q820 820 1700 380" stroke="#E8A5B5" stroke-width="3" opacity=".3"/><path d="M-60 420 Q820 760 1700 420" stroke="#D2323C" stroke-width="3" opacity=".35"/></svg>
 <div class="word" style="font-size:110px;position:relative">HAMACA</div>
 <div class="sub" style="font-size:26px;margin-top:12px;position:relative">Fisioterapia de la mujer</div>
 <div style="position:relative;margin-top:34px;font:700 40px Montserrat">La fisioterapia que <span style="color:var(--rosa)">sostiene</span> a las mujeres</div>
 <div style="position:relative;margin-top:18px;font:500 26px Inter;color:var(--rosa)">Consulta presencial en CORE Oaxaca · en línea para toda Latinoamérica</div>
</div>

</body></html>
